<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAFILAH</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #09000f;
}

body {
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
}

.center {
    position: fixed;
    z-index: 10;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: clamp(35px, 10vw, 75px);

    font-weight: 700;

    letter-spacing: 8px;

    text-shadow:
        0 0 8px #ff8bd8,
        0 0 20px #ff4fc3,
        0 0 40px #b44cff;

    animation: pulse 2s infinite ease-in-out;
}

@keyframes pulse {

    0%, 100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.08);
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="center">
    NAFILAH
</div>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let width;
let height;


/* =====================================
   UKURAN LAYAR
===================================== */

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================
   PENGATURAN NAFILAH
===================================== */

const rings = 18;

const wordsPerRing = 30;

const names = [];


/* =====================================
   MEMBUAT BANYAK NAFILAH
===================================== */

for (
    let ring = 0;
    ring < rings;
    ring++
) {

    for (
        let i = 0;
        i < wordsPerRing;
        i++
    ) {

        names.push({

            ring: ring,

            angle:
                (
                    Math.PI * 2 /
                    wordsPerRing
                ) * i,

            speed:
                0.0002 +
                Math.random() *
                0.0006,

            size:
                9 +
                Math.random() * 7,

            opacity:
                0.2 +
                Math.random() * 0.8,

            phase:
                Math.random() *
                Math.PI * 2
        });
    }
}


/* =====================================
   BINTANG
===================================== */

const stars = [];

for (
    let i = 0;
    i < 250;
    i++
) {

    stars.push({

        x:
            Math.random() *
            width,

        y:
            Math.random() *
            height,

        size:
            Math.random() * 1.5,

        phase:
            Math.random() *
            Math.PI * 2
    });
}


function drawStars(time) {

    for (
        const star of stars
    ) {

        const opacity =
            0.2 +
            Math.sin(
                time * 0.002 +
                star.phase
            ) * 0.3;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(
                255,
                180,
                240,
                ${opacity}
            )`;

        ctx.fill();
    }
}


/* =====================================
   ANIMASI
===================================== */

function animate(time) {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawStars(time);


    const centerX =
        width / 2;

    const centerY =
        height / 2;


    const base =
        Math.min(
            width,
            height
        );


    /* =================================
       SEMUA NAFILAH
    ================================= */

    for (
        const name of names
    ) {

        let radius =
            base * 0.025 +
            name.ring *
            base * 0.035;


        /* Denyut */

        radius *=
            1 +
            Math.sin(
                time * 0.002 +
                name.ring * 0.3
            ) * 0.06;


        /* Rotasi */

        const angle =
            name.angle +
            time * name.speed +
            name.ring * 0.08;


        /* Posisi */

        const x =
            centerX +
            Math.cos(angle) *
            radius;

        const y =
            centerY +
            Math.sin(angle) *
            radius;


        ctx.save();


        ctx.translate(
            x,
            y
        );


        /* Mengikuti lingkaran */

        ctx.rotate(
            angle +
            Math.PI / 2
        );


        /* Membesar mengecil */

        const pulse =
            1 +
            Math.sin(
                time * 0.003 +
                name.phase
            ) * 0.12;


        ctx.scale(
            pulse,
            pulse
        );


        ctx.font =
            `bold ${name.size}px Arial`;


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        /* Warna bestie */

        const color =
            name.ring % 3 === 0
                ? `rgba(
                    255,
                    130,
                    215,
                    ${name.opacity}
                  )`
                : name.ring % 3 === 1
                ? `rgba(
                    190,
                    120,
                    255,
                    ${name.opacity}
                  )`
                : `rgba(
                    255,
                    180,
                    240,
                    ${name.opacity}
                  )`;


        ctx.fillStyle =
            color;


        ctx.shadowBlur =
            14;


        ctx.shadowColor =
            "#e95cff";


        ctx.fillText(
            "NAFILAH",
            0,
            0
        );


        ctx.restore();
    }


    requestAnimationFrame(
        animate
    );
}


animate(0);

</script>

</body>
</html>
