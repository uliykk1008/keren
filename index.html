<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE YOU ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
}

.center {
    position: fixed;
    z-index: 10;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    color: white;
    font-size: clamp(28px, 7vw, 55px);
    font-weight: 300;
    letter-spacing: 7px;
    white-space: nowrap;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 25px #ff1493,
        0 0 50px #ff1493;

    animation: heartbeat 1.6s infinite ease-in-out;
}

@keyframes heartbeat {
    0%, 100% {
        transform: translate(-50%, -50%) scale(1);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.12);
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="center">
    I LOVE YOU ❤️
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* =========================================
   JUMLAH LINGKARAN DAN LOVE
========================================= */

const rings = 20;
const wordsPerRing = 40;

const loves = [];


/* =========================================
   MEMBUAT BANYAK LOVE
========================================= */

for (let ring = 0; ring < rings; ring++) {

    for (let i = 0; i < wordsPerRing; i++) {

        loves.push({

            ring: ring,

            angle:
                (Math.PI * 2 / wordsPerRing) * i,

            speed:
                0.0002 +
                Math.random() * 0.0005,

            size:
                9 +
                Math.random() * 8,

            opacity:
                0.25 +
                Math.random() * 0.75,

            phase:
                Math.random() * Math.PI * 2
        });
    }
}


/* =========================================
   BINTANG
========================================= */

const stars = [];

for (let i = 0; i < 250; i++) {

    stars.push({

        x: Math.random() * width,

        y: Math.random() * height,

        size:
            Math.random() * 1.5,

        phase:
            Math.random() * Math.PI * 2
    });
}


function drawStars(time) {

    for (const star of stars) {

        const opacity =
            0.15 +
            Math.sin(
                time * 0.002 +
                star.phase
            ) * 0.25;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${opacity})`;

        ctx.fill();
    }
}


/* =========================================
   ANIMASI
========================================= */

function animate(time) {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    drawStars(time);

    const centerX = width / 2;
    const centerY = height / 2;

    const baseRadius =
        Math.min(width, height) * 0.025;


    for (const love of loves) {

        /* Jarak setiap lingkaran */

        let radius =
            baseRadius +
            love.ring *
            Math.min(width, height) *
            0.035;


        /* Efek denyut */

        const heartbeat =
            1 +
            Math.sin(
                time * 0.002 +
                love.ring * 0.25
            ) * 0.06;

        radius *= heartbeat;


        /* Rotasi */

        const angle =
            love.angle +
            time * love.speed +
            love.ring * 0.08;


        /* Posisi */

        const x =
            centerX +
            Math.cos(angle) *
            radius;

        const y =
            centerY +
            Math.sin(angle) *
            radius;


        ctx.save();

        ctx.translate(x, y);


        /* LOVE ikut berputar */

        ctx.rotate(
            angle + Math.PI / 2
        );


        /* LOVE membesar dan mengecil */

        const pulse =
            1 +
            Math.sin(
                time * 0.003 +
                love.phase
            ) * 0.12;

        ctx.scale(
            pulse,
            pulse
        );


        ctx.font =
            `bold ${love.size}px Arial`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        /* Warna pink bercahaya */

        ctx.fillStyle =
            `rgba(
                255,
                70,
                170,
                ${love.opacity}
            )`;


        ctx.shadowBlur = 14;

        ctx.shadowColor =
            "#ff1493";


        ctx.fillText(
            "LOVE",
            0,
            0
        );


        ctx.restore();
    }


    requestAnimationFrame(
        animate
    );
}

animate(0);

</script>

</body>
</html>
