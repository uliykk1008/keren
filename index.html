<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020002;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
}

.message {
    position: fixed;
    z-index: 10;
    color: white;
    text-align: center;
    font-size: clamp(25px, 7vw, 55px);
    letter-spacing: 8px;
    font-weight: 300;
    text-shadow:
        0 0 8px #ff4fa3,
        0 0 20px #ff1684,
        0 0 40px #ff1684;
    animation: heartbeat 1.8s infinite ease-in-out;
    user-select: none;
}

.heart {
    color: #ff4fa3;
    font-size: 25px;
    display: block;
    margin-top: 15px;
    text-shadow:
        0 0 10px #ff1684,
        0 0 30px #ff1684;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

.start {
    position: fixed;
    z-index: 20;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #020002;
    color: white;
    font-size: 18px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: opacity 1s ease;
}

.start.hide {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="message">
    I LOVE YOU
    <span class="heart">♥</span>
</div>

<div class="start" id="start">
    TAP TO BEGIN ♥
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

const particles = [];
const particleCount = 1200;

let mouse = {
    x: null,
    y: null
};

function resize() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);

window.addEventListener("mousemove", (e) => {

    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("touchmove", (e) => {

    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
});


/* ==========================
   HEART FORMULA
========================== */

function heart(t) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: y
    };
}


/* ==========================
   PARTICLE
========================== */

class Particle {

    constructor() {

        this.reset(true);
    }

    reset(first = false) {

        this.t = Math.random() * Math.PI * 2;

        this.size =
            Math.random() * 1.8 + 0.5;

        this.speed =
            Math.random() * 0.025 + 0.005;

        this.phase =
            Math.random() * Math.PI * 2;

        this.alpha =
            Math.random() * 0.7 + 0.3;

        this.offset =
            (Math.random() - 0.5) * 2;

        const h = heart(this.t);

        const scale =
            Math.min(width, height) * 0.018;

        this.x =
            width / 2 + h.x * scale;

        this.y =
            height / 2 - h.y * scale;

        if (!first) {

            this.x =
                Math.random() * width;

            this.y =
                Math.random() * height;
        }
    }

    update(time) {

        this.t += this.speed;

        if (this.t > Math.PI * 2) {
            this.t = 0;
        }

        const h = heart(this.t);

        const beat =
            1 +
            Math.sin(time * 0.003) * 0.045;

        const scale =
            Math.min(width, height) *
            0.018 *
            beat;

        let targetX =
            width / 2 +
            h.x * scale;

        let targetY =
            height / 2 -
            h.y * scale;

        /* floating movement */

        targetX +=
            Math.sin(time * 0.0015 + this.phase) *
            2;

        targetY +=
            Math.cos(time * 0.0012 + this.phase) *
            2;

        /* mouse attraction */

        if (
            mouse.x !== null &&
            mouse.y !== null
        ) {

            const dx = mouse.x - targetX;
            const dy = mouse.y - targetY;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < 120) {

                targetX -=
                    dx * 0.08;

                targetY -=
                    dy * 0.08;
            }
        }

        this.x +=
            (targetX - this.x) * 0.035;

        this.y +=
            (targetY - this.y) * 0.035;
    }

    draw() {

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255, 50, 150, ${this.alpha})`;

        ctx.shadowBlur = 12;

        ctx.shadowColor =
            "#ff1684";

        ctx.fill();
    }
}


/* ==========================
   CREATE PARTICLES
========================== */

for (let i = 0; i < particleCount; i++) {

    particles.push(
        new Particle()
    );
}


/* ==========================
   BACKGROUND STARS
========================== */

const stars = [];

for (let i = 0; i < 150; i++) {

    stars.push({

        x: Math.random() * width,

        y: Math.random() * height,

        size:
            Math.random() * 1.5,

        alpha:
            Math.random()
    });
}


function drawStars(time) {

    for (const star of stars) {

        const glow =
            0.3 +
            Math.sin(
                time * 0.002 +
                star.x
            ) * 0.3;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${glow})`;

        ctx.fill();
    }
}


/* ==========================
   ANIMATION
========================== */

function animate(time) {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    drawStars(time);

    for (const particle of particles) {

        particle.update(time);

        particle.draw();
    }

    requestAnimationFrame(animate);
}

animate(0);


/* ==========================
   START SCREEN
========================== */

const start =
    document.getElementById("start");

start.addEventListener("click", () => {

    start.classList.add("hide");

});

</script>

</body>
</html>
