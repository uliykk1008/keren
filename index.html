<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAFILAH</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03010a;
}

body {
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
}

.name {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    color: white;
    font-size: clamp(42px, 12vw, 90px);
    font-weight: 700;
    letter-spacing: 12px;

    opacity: 0;

    text-shadow:
        0 0 10px #ffffff,
        0 0 25px #ff8de1,
        0 0 50px #b66cff,
        0 0 90px #8d4dff;

    animation: appear 3s ease forwards,
               glow 2s ease-in-out infinite 3s;

    pointer-events: none;
}

@keyframes appear {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0.4);
        filter: blur(15px);
    }

    70% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.08);
        filter: blur(0);
    }

    100% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
        filter: blur(0);
    }
}

@keyframes glow {
    0%, 100% {
        text-shadow:
            0 0 10px #ffffff,
            0 0 25px #ff8de1,
            0 0 50px #b66cff;
    }

    50% {
        text-shadow:
            0 0 15px #ffffff,
            0 0 35px #ff8de1,
            0 0 75px #b66cff,
            0 0 110px #8d4dff;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="name">
    NAFILAH
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* =====================================
   PARTIKEL
===================================== */

const particles = [];

const particleCount = 1300;

for (let i = 0; i < particleCount; i++) {

    particles.push({
        x: Math.random() * width,
        y: Math.random() * height,

        targetX: width / 2,
        targetY: height / 2,

        size: Math.random() * 2 + 0.5,

        speed:
            Math.random() * 0.025 + 0.005,

        angle:
            Math.random() * Math.PI * 2,

        radius:
            Math.random() *
            Math.max(width, height) *
            0.7,

        phase:
            Math.random() * Math.PI * 2,

        opacity:
            Math.random() * 0.8 + 0.2
    });
}


/* =====================================
   BINTANG
===================================== */

const stars = [];

for (let i = 0; i < 250; i++) {

    stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2
    });
}


function drawStars(time) {

    for (const star of stars) {

        const alpha =
            0.15 +
            Math.sin(
                time * 0.002 +
                star.phase
            ) * 0.25;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${alpha}
            )`;

        ctx.fill();
    }
}


/* =====================================
   MEMBUAT TARGET TEKS
===================================== */

const textCanvas =
    document.createElement("canvas");

const textCtx =
    textCanvas.getContext("2d");

function createTextTargets() {

    textCanvas.width = width;
    textCanvas.height = height;

    textCtx.clearRect(
        0,
        0,
        width,
        height
    );

    const fontSize =
        Math.min(width * 0.16, 110);

    textCtx.font =
        `bold ${fontSize}px Arial`;

    textCtx.textAlign = "center";
    textCtx.textBaseline = "middle";

    textCtx.fillStyle = "white";

    textCtx.fillText(
        "NAFILAH",
        width / 2,
        height / 2
    );

    const image =
        textCtx.getImageData(
            0,
            0,
            width,
            height
        );

    const points = [];

    for (
        let y = 0;
        y < height;
        y += 4
    ) {

        for (
            let x = 0;
            x < width;
            x += 4
        ) {

            const index =
                (y * width + x) * 4;

            if (image.data[index + 3] > 100) {

                points.push({
                    x: x,
                    y: y
                });
            }
        }
    }

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const point =
            points[
                i % points.length
            ];

        particles[i].targetX =
            point.x;

        particles[i].targetY =
            point.y;
    }
}

createTextTargets();


/* =====================================
   ANIMASI
===================================== */

function animate(time) {

    ctx.fillStyle =
        "rgba(3,1,10,0.18)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    drawStars(time);


    const progress =
        (Math.sin(time * 0.0007) + 1) / 2;


    for (
        const particle of particles
    ) {

        /*
          Partikel bergerak menuju
          bentuk NAFILAH
        */

        const attraction =
            0.008 +
            progress * 0.025;


        particle.x +=
            (
                particle.targetX -
                particle.x
            ) * attraction;


        particle.y +=
            (
                particle.targetY -
                particle.y
            ) * attraction;


        /*
          Gerakan lembut
        */

        particle.x +=
            Math.sin(
                time * 0.001 +
                particle.phase
            ) * 0.25;


        particle.y +=
            Math.cos(
                time * 0.0012 +
                particle.phase
            ) * 0.25;


        /*
          Glow
        */

        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(
                255,
                ${80 + Math.random() * 100},
                220,
                ${particle.opacity}
            )`;

        ctx.shadowBlur = 12;

        ctx.shadowColor =
            "#ff5bd7";

        ctx.fill();
    }


    /*
      Partikel cahaya tambahan
    */

    for (let i = 0; i < 8; i++) {

        const angle =
            time * 0.0004 +
            i;

        const radius =
            Math.min(width, height) *
            0.35;

        const x =
            width / 2 +
            Math.cos(angle) *
            radius;

        const y =
            height / 2 +
            Math.sin(angle) *
            radius;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.shadowBlur = 20;

        ctx.shadowColor =
            "#ff75dc";

        ctx.fill();
    }


    requestAnimationFrame(
        animate
    );
}

animate(0);

</script>

</body>
</html>
